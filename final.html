<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order Success – Shoppy Bazzar</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after {
    margin: 0; padding: 0; box-sizing: border-box;
  }

  :root {
    --brand: #FF6B2B;
    --brand-dark: #E05520;
    --brand-light: #FFF0E8;
    --surface: #FFFFFF;
    --bg: #F5F4F1;
    --text-primary: #1A1A1A;
    --text-secondary: #6B6B6B;
    --text-hint: #9E9E9E;
    --border: rgba(0,0,0,0.10);
    --radius-sm: 8px;
    --radius-md: 12px;
    --radius-lg: 16px;
    --shadow-card: 0 2px 16px rgba(0,0,0,0.08);
  }

  body {
    font-family: 'Inter', Arial, sans-serif;
    background: var(--bg);
    color: var(--text-primary);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ── NAVBAR ── */
  nav {
    background: #1A1A1A;
    padding: 0 20px;
    height: 60px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    text-decoration: none;
  }

  .brand-icon {
    width: 36px; height: 36px;
    background: var(--brand);
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; font-weight: 700;
    color: white; letter-spacing: -1px; flex-shrink: 0;
  }

  .brand-name {
    font-size: 16px; font-weight: 700;
    color: white; letter-spacing: -0.3px;
  }

  .brand-name span { color: var(--brand); }

  .nav-links { display: flex; gap: 4px; list-style: none; }

  .nav-links a {
    color: rgba(255,255,255,0.75);
    text-decoration: none;
    font-size: 13px; font-weight: 500;
    padding: 6px 10px; border-radius: 6px;
    transition: all 0.15s ease; letter-spacing: 0.2px;
  }

  .nav-links a:hover { color: white; background: rgba(255,255,255,0.10); }

  /* ── SUCCESS SECTION ── */
  main {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 16px;
  }

  .success-card {
    width: 100%;
    max-width: 440px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-card);
    padding: 44px 30px 38px;
    text-align: center;
    animation: fadeIn 0.6s ease;
  }

  .check {
    width: 84px;
    height: 84px;
    margin: 0 auto;
    border-radius: 50%;
    background: orange;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 40px;
    color: var(--brand);
    animation: pop 0.5s ease;
  }

  .success-card h1 {
    margin-top: 22px;
    font-size: 22px;
    font-weight: 700;
    color: var(--text-primary);
    letter-spacing: -0.4px;
    line-height: 1.35;
  }

  .success-card p {
    margin-top: 12px;
    font-size: 14px;
    color: var(--text-secondary);
    line-height: 1.6;
  }

  .btn-home {
    display: inline-block;
    margin-top: 28px;
    padding: 12px 32px;
    background: var(--brand);
    color: white;
    text-decoration: none;
    border-radius: var(--radius-sm);
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.1px;
    transition: all 0.15s ease;
  }

  .btn-home:hover {
    background: var(--brand-dark);
    transform: translateY(-1px);
    box-shadow: 0 4px 12px rgba(255,107,43,0.35);
  }

  .btn-home:active { transform: translateY(0); box-shadow: none; }

  /* ── FOOTER ── */
  footer {
    text-align: center;
    padding: 20px;
    font-size: 12px;
    color: var(--text-hint);
    border-top: 1px solid var(--border);
  }

  /* ── ANIMATIONS ── */
  @keyframes pop {
    0% { transform: scale(0); }
    100% { transform: scale(1); }
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* ── RESPONSIVE ── */
  @media (min-width: 640px) {
    nav { padding: 0 40px; }
  }

  @media (max-width: 360px) {
    .success-card h1 { font-size: 19px; }
    .success-card p { font-size: 13px; }
  }
</style>
</head>
<body>

<!-- Navbar -->
<nav>
  <a class="brand" href="index.html">
    <div class="brand-icon">SB</div>
    <span class="brand-name">Shoppy <span>Bazzar</span></span>
  </a>
  <ul class="nav-links">
    <li><a href="Boy.html">Boys</a></li>
    <li><a href="Girl.html">Girls</a></li>
    <li><a href="Kid.html">Kids</a></li>
  </ul>
</nav>

<main>
  <div class="success-card">
    <div class="check">✓</div>
    <h1>Your Order Has Been Submitted Successfully!</h1>
    <p>
      Thank you for shopping with us.
      Your order is being processed and you will receive updates soon.
    </p>
    <a href="index.html" class="btn-home">Back To Home</a>
  </div>
</main>

<footer>
  &copy; 2026 Shoppy Bazzar &nbsp;·&nbsp; All rights reserved
</footer>

</body>
</html>
