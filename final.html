<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Order Success</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body{
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #0f172a, #1e293b, #334155);
            overflow: hidden;
        }

        .main{
            width: 90%;
            max-width: 500px;
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 25px;
            padding: 50px 30px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.4);
            animation: fadeIn 1s ease;
        }

        .check{
            width: 100px;
            height: 100px;
            margin: auto;
            border-radius: 50%;
            background: #22c55e;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 50px;
            color: white;
            box-shadow: 0 0 25px #22c55e;
            animation: pop 0.6s ease;
        }

        h1{
            margin-top: 25px;
            color: white;
            font-size: 32px;
            line-height: 45px;
        }

        p{
            margin-top: 15px;
            color: #d1d5db;
            font-size: 16px;
            line-height: 26px;
        }

        .btn{
            display: inline-block;
            margin-top: 30px;
            padding: 14px 35px;
            background: linear-gradient(135deg, #22c55e, #16a34a);
            color: white;
            text-decoration: none;
            border-radius: 50px;
            font-size: 17px;
            font-weight: 500;
            transition: 0.3s;
            box-shadow: 0 5px 20px rgba(34,197,94,0.5);
        }

        .btn:hover{
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 8px 25px rgba(34,197,94,0.7);
        }

        @keyframes pop{
            0%{
                transform: scale(0);
            }
            100%{
                transform: scale(1);
            }
        }

        @keyframes fadeIn{
            from{
                opacity: 0;
                transform: translateY(30px);
            }
            to{
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media(max-width:600px){
            h1{
                font-size: 24px;
                line-height: 35px;
            }

            p{
                font-size: 14px;
            }
            
        }
    </style>
</head>
<body>

    <div class="main">

        <div class="check">✓</div>

        <h1>Your Order Has Been Submitted Successfully!</h1>

        <p>
            Thank you for shopping with us.  
            Your order is being processed and you will receive updates soon.
        </p>

        <a href="index.html" class="btn">Back To Home</a>

    </div>

</body>
</html>
