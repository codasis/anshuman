<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shoppy Bazzar</title>

    <link rel="stylesheet" href="index.css">
</head>

<body>

    <!-- Navbar -->
    <nav class="nv">
        <div class="brand">
            <img src="PIC/ikj.webp" alt="Logo">
            <h2>Shoppy Bazzar</h2>
        </div>

        <ul class="menu">
            <li><a href="Boy.html">Boys</a></li>
            <li><a href="Girl.html">Girls</a></li>
            <li><a href="Kid.html">Kids</a></li>
        </ul>
    </nav>

    <!-- Registration Form -->
    <section class="container">
        <form onsubmit="fun(event)">
            <h1>Registration Form</h1>

            <div class="input-box">
                <label>Full Name</label>
                <input type="text" placeholder="Enter your name" required>
            </div>

            <div class="input-box">
                <label>Contact Number</label>
                <input type="tel" placeholder="Enter contact number" required>
            </div>

            <div class="btn-group">
                <button type="submit" id="sb" onclick="fun()">Register</button>
                <button type="reset" id="rs">Reset</button>
            </div>
        </form>
    </section>

    <script>
        function fun() {
            alert("User Successfully Registered!");
            location.reload
        }

    </script>

</body>
</html>
